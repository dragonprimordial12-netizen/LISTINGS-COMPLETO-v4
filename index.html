let uid=0;
function F(label,content){
  const id='x'+(uid++);
  return `<div class="fld"><div class="flb"><span>${label}</span><button class="cpb" onclick="cp('${id}')">${LANG==='en'?'Copy':'Copiar'}<span class="ok" id="c-${id}">✓</span></button></div><pre id="${id}">${content.replace(/</g,'&lt;')}</pre></div>`;
}
function INF(html){return `<div class="inf">${html}</div>`;}
function SL(cls,txt){return `<div class="sl ${cls}">${txt}</div>`;}

const LINKS_YT_EN=(slug)=>`🛒 Buy it (BuiltByBit): ${D.bbb}\n🎮 itch.io: ${D.itch}${slug}\n💬 Discord: ${D.disc}\n🐦 X/Twitter: ${D.tw}\n🎵 TikTok: ${D.tt}\n☕ Ko-fi: ${D.kofi}\n\nContact me if you have any questions.`;
const TIPO_EN={'NPC de Bestia Pura':'Pure Beast NPC','NPC de Bestia Corrupta':'Corrupted Beast NPC','NPC Jefe':'Boss NPC','NPC Hostil':'Hostile NPC'};
const LBL=(es,en)=>LANG==='en'?en:es;

function buildNPCPanels(arr,plat){
  const tabs=arr.map(([id])=>`<button class="ib" data-npctab="${plat}-npc-${id}" onclick="showNPC(this,'${plat}-npc-${id}')">${arr.find(a=>a[0]===id)[1].replace('💠','').replace('♦️','').trim()} ${arr.find(a=>a[0]===id)[LANG==='en'?2:5].split(' ').slice(0,2).join(' ')}</button>`).join('');

  let panels='';
  arr.forEach(([id,em,name_en,sum_en,slug,nombre_es,tipo_es,intro_es,detalle_es,archivo,feat_es,em_tt,tags_tt,intro_en,detalle_en,feat_en])=>{
    const cleanName=name_en.replace(' Roblox NPC','');
    const descES=npcDescES(em,nombre_es,tipo_es,intro_es,detalle_es,archivo,feat_es);
    const descEN=npcDescEN(em,cleanName,TIPO_EN[tipo_es]||'NPC',intro_en,detalle_en,archivo,feat_en);
    const shortName=nombre_es;

    if(plat==='bbb'){
      panels+=`<div id="bbb-npc-${id}" class="npc-panel">
        ${F(LBL('Título (en inglés — requerido BBB)','Title (required in English by BBB)'),name_en)}
        ${F(LBL('Summary (en inglés)','Summary'),sum_en)}
        ${F(LBL('Descripción completa','Full description'),LANG==='en'?descEN:descES)}
        ${F('Tags',TAGS_NPC)}
        ${INF('<b>'+LBL('Precio','Price')+':</b> $15.00 · <b>'+LBL('Categoría','Category')+':</b> Roblox → Models · <b>'+LBL('Idiomas','Languages')+':</b> ✅ English · <b>Open source:</b> '+LBL('Sí','Yes')+' · <b>Utility:</b> Unscripted')}
      </div>`;
    } else if(plat==='itch'){
      panels+=`<div id="itch-npc-${id}" class="npc-panel">
        ${F(LBL('Título','Title'),LANG==='en'?cleanName+' — Roblox NPC':shortName+' — NPC Roblox')}
        ${F(LBL('URL del proyecto','Project URL'),slug)}
        ${F(LBL('Descripción corta / tagline','Short description / tagline'),LANG==='en'?sum_en:intro_es)}
        ${F(LBL('Descripción completa','Full description'),LANG==='en'?descEN:descES)}
        ${F('Tags',TAGS_NPC)}
        ${INF('<b>'+LBL('Precio','Price')+':</b> Paid $15.00 · <b>'+LBL('Tipo','Type')+':</b> Downloadable · <b>Custom noun:</b> asset · <b>AI Disclosure:</b> No')}
      </div>`;
    } else if(plat==='yt'){
      panels+=`<div id="yt-npc-${id}" class="npc-panel">
        ${F(LBL('Título del vídeo','Video title'),LANG==='en'?'[FOR SALE] '+cleanName+' | Roblox Studio':'[EN VENTA] '+name_en.replace(' Roblox NPC','')+' | Roblox Studio')}
        ${F(LBL('Descripción YT','YT description'),LANG==='en'
          ?('#robloxdev #robloxstudio #roblox\n\n'+cleanName+' for Roblox.\n'+intro_en+'\n\n'+LINKS_YT_EN(slug))
          :('#robloxdev #robloxstudio #roblox\n\n'+shortName+' para Roblox.\n'+intro_es+'\n\n'+LINKS_YT(slug)))}
      </div>`;

// ─── INTERACTIONS ─────────────────────────────────────────────
function activatePlat(id,btn,cls){
  document.querySelectorAll('.plat-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.pb').forEach(b=>b.className='pb');
  document.getElementById('plat-'+id).classList.add('active');
  btn.classList.add(cls);
  // auto-select the first item in EVERY group (ibar), not just the first one overall
  document.querySelectorAll('#plat-'+id+' .ibar').forEach(ib=>{
    const first=ib.querySelector('.ib');
    if(first)first.click();
  });
}

function showNPC(btn,key){
  const group=btn.closest('.npc-group');
  // deactivate all tabs in this group
  group.querySelectorAll('.ib').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // hide all panels in this group only, then show the target one
  group.querySelectorAll('.npc-panel').forEach(p=>p.classList.remove('active'));
  const target=document.getElementById(key);
  if(target)target.classList.add('active');
}

function cp(id){
  const el=document.getElementById(id);if(!el)return;
  navigator.clipboard.writeText(el.textContent).then(()=>{
    const ok=document.getElementById('c-'+id);
    if(ok){ok.classList.add('show');setTimeout(()=>ok.classList.remove('show'),2000);}
  });
}

function setLang(lang){
  LANG=lang;
  document.getElementById('lb-es').classList.toggle('active',lang==='es');
  document.getElementById('lb-en').classList.toggle('active',lang==='en');
  buildAll();
  const first=document.querySelector('.pb');
  if(first)first.click();
}

// Init
document.querySelector('.pb').click();
